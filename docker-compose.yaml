services:
  db:
    image: mariadb:latest
    container_name: camagru_db
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./conf/setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: camagru_app
    restart: on-failure
    volumes:
      - ./srcs:/var/www/html
    depends_on:
      - db
    environment:
      DB_HOST: ${DB_HOST}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

  server:
    image: nginx:stable-alpine
    container_name: camagru_server
    restart: on-failure
    ports:
      - "8080:80"
    volumes:
      - ./srcs:/var/www/html
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

volumes:
  db_data:
